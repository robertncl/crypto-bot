# ── AGGRESSIVE risk profile ────────────────────────────────────────────────
# Momentum-chasing: Donchian breakouts across five pairs (including higher-beta
# alts) with large positions, held until the opposite breakout. On 4h bars - the
# 1h version traded so often that fees consumed more than it earned. No take-profit:
# the occasional big trend has to pay for the frequent false starts. High risk,
# high variance - paper-trade this hard before believing it.
#
#   crypto-bot backtest --bot aggressive --days 365
#   crypto-bot run --bot aggressive

# Catalog metadata (descriptive only): `crypto-bot bots` lists it, `compare` measures it.
bot:
  name: Breakout Hunter
  category: breakout
  risk_level: 4            # fully deployable (5 x 20%), long-only, trend-filtered
  return_potential: very high
  summary: Chases 20-bar breakouts on five pairs with large positions, held until they fail.
  best_for: Volatile, trending markets where breakouts follow through.
  main_risk: Deep drawdowns - whipsaw in chop, and a fully invested book when a bull run ends.

mode: paper

exchange:
  name: binance
  sandbox: false
  options: {}

# More pairs, including higher-beta alts that trend harder (and crash harder).
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - BNB/USDT
  - XRP/USDT

# 4h bars: a quarter of the trades of the 1h chart, and a real edge left after fees.
timeframe: 4h
poll_seconds: 60
signal_on_close: true     # decide once per completed candle, exactly as a backtest does

strategy:
  name: breakout           # buy new highs, sell new lows
  params:
    lookback: 20           # 20-bar Donchian channel

risk:
  position_pct: 0.20       # 20% of equity per position — concentrated bets
  max_open_positions: 5    # fully deployed across all symbols
  stop_loss_pct: 0.0       # off: replaced by the volatility-scaled stop below
  atr_stop_mult: 3.0       # disaster stop 3 ATRs below entry
  take_profit_pct: 0.0     # off: winners run until the 20-bar low breaks
  trend_filter_period: 200 # only buy breakouts above the 200-bar (~33-day) average
  max_drawdown_pct: 0.40   # tolerate a deep drawdown before halting
  drawdown_cooldown_days: 30 # re-arm the kill-switch after a 30-day pause

paper:
  starting_cash: 10000.0
  quote_currency: USDT
  fee_rate: 0.001
  slippage_pct: 0.0005

logging:
  level: INFO
  file: logs/crypto-bot.log
