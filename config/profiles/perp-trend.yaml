# ── PERP TREND profile (long/short on perpetual futures) ───────────────────
# The highest-risk recipe in the box. A filtered Donchian breakout (ADX strength
# + EMA-100 regime) traded BOTH ways on perpetual swaps: long breakouts in uptrends,
# short breakdowns in downtrends, stop-and-reverse between them. Nearly all equity
# can be deployed and positions pay or earn funding every 8h.
#
# On 4h bars with no trailing stop: the old 1h version with an 8% trail was stopped
# out of every trend it caught. The long side carries the returns; the short side
# has roughly broken even over a full cycle and is there to make bear markets
# tradable rather than to add profit.
#
# Requires perp symbols (BASE/QUOTE:SETTLE). See docs/DERIVATIVES.md. Before going
# live, set leverage to 1x for these symbols ON THE EXCHANGE: the bot refuses to start
# live if it is higher, since a levered isolated position can be liquidated before the
# stop-loss fires.
#   crypto-bot backtest --bot perp-trend --days 365
#   crypto-bot run --bot perp-trend

# Catalog metadata (descriptive only): `crypto-bot bots` lists it, `compare` measures it.
bot:
  name: Perp Long/Short Trend
  category: long-short
  risk_level: 5            # up to ~90% deployed, two-sided on perps
  return_potential: very high
  summary: Trades filtered 4h breakouts long AND short on BTC/ETH/SOL perpetuals.
  best_for: Strong trends in either direction, including bear markets.
  main_risk: Losing on both sides in chop, deep drawdowns, and funding costs.

mode: paper

exchange:
  name: binance
  sandbox: false
  options: {}

# Perpetual swaps (note the :USDT settlement suffix) - spot pairs cannot be shorted.
symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - SOL/USDT:USDT

timeframe: 4h
poll_seconds: 60
signal_on_close: true     # decide once per completed candle, exactly as a backtest does

strategy:
  name: trend_ls
  params:
    lookback: 20             # Donchian channel
    adx_period: 14
    adx_threshold: 20        # only trade breaks while the market is trending
    trend_period: 100        # long above EMA-100, short below it

derivatives:
  allow_shorts: true         # SELL opens a short; the engine stop-and-reverses
  funding_interval_hours: 8
  funding_rate: 0.0001       # fallback per-interval rate for paper/backtest accrual

risk:
  position_pct: 0.30         # 30% of equity per position
  max_open_positions: 3
  stop_loss_pct: 0.0         # off: replaced by the volatility-scaled stop below
  atr_stop_mult: 3.0         # 3 ATRs against the position (above entry for a short)
  trailing_stop_pct: 0.0     # off: an 8% trail was the single most damaging setting
  take_profit_pct: 0.0       # off: the opposite breakout ends (and reverses) the trade
  max_drawdown_pct: 0.40
  drawdown_cooldown_days: 30 # re-arm the kill-switch after a 30-day pause

paper:
  starting_cash: 10000.0
  quote_currency: USDT
  fee_rate: 0.0005           # perp taker fees are typically lower than spot
  slippage_pct: 0.0005

logging:
  level: INFO
  file: logs/crypto-bot.log
