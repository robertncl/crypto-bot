# ── CONSERVATIVE risk profile ──────────────────────────────────────────────
# Capital-preservation first: buy statistically stretched dips on the two deepest
# markets, but only while the long-run trend is up, and sell as soon as price
# reverts to its average. Small positions, a volatility-scaled stop, and a tight
# drawdown kill-switch. Few trades; the goal is to survive, not to win big.
#
#   crypto-bot backtest --bot conservative --days 365
#   crypto-bot run --bot conservative

# Catalog metadata (descriptive only): `crypto-bot bots` lists it, `compare` measures it.
bot:
  name: Capital Preserver
  category: mean-reversion
  risk_level: 1            # ~10% of equity deployed at most, slow daily bars
  return_potential: low
  summary: Buys stretched dips in an uptrend with tiny positions and exits at the average.
  best_for: Calm, rising majors; learning the bot with almost nothing at stake.
  main_risk: Sits out most of the time; a dip that keeps falling costs one small stop.

mode: paper

exchange:
  name: binance
  sandbox: false
  options: {}

# Majors only — the deepest, least-manipulated markets.
symbols:
  - BTC/USDT
  - ETH/USDT

# High timeframe = far fewer, higher-quality signals and much lower fee drag.
timeframe: 1d
poll_seconds: 60
signal_on_close: true     # decide once per completed candle, exactly as a backtest does

strategy:
  name: bollinger          # buy statistically stretched dips
  params:
    period: 20
    num_std: 2.0           # require a genuine 2σ stretch before acting
    exit_on_mean: true     # sell when price is back at its 20-day average

risk:
  position_pct: 0.05       # only 5% of equity per position
  max_open_positions: 2    # minimal concurrent exposure
  stop_loss_pct: 0.0       # off: a fixed % stop sits inside normal daily swings
  atr_stop_mult: 3.0       # stop 3 ATRs below entry: scaled to current volatility
  take_profit_pct: 0.0     # off: the exit is the reversion to the mean
  trend_filter_period: 200 # only buy dips while price is above its 200-day average
  max_drawdown_pct: 0.15   # halt early if things go wrong
  drawdown_cooldown_days: 30 # re-arm the kill-switch after a 30-day pause

paper:
  starting_cash: 10000.0
  quote_currency: USDT
  fee_rate: 0.001
  slippage_pct: 0.0005

logging:
  level: INFO
  file: logs/crypto-bot.log
