# ── GRID profile (range harvester) ─────────────────────────────────────────
# The classic exchange grid bot. A ladder of price lines 2% apart: every fall
# through a line buys one small tranche, every rise through a line sells it again,
# so each round trip earns roughly one grid step minus fees. No direction call at
# all - it profits from oscillation. While flat, the grid trails price upward.
#
# The grid takes its own profits line by line, so take-profit is off. The stack is
# capped per symbol, and a wide stop plus the kill-switch bound a downtrend.
#
# Backtest it first, then paper-trade it:
#   crypto-bot backtest --bot grid --days 180
#   crypto-bot run --bot grid

# Catalog metadata (descriptive only): `crypto-bot bots` lists it, `compare` measures it.
bot:
  name: Grid Trader
  category: grid
  risk_level: 3            # up to ~60% deployed (2 symbols x 30% cap), wide stop
  return_potential: moderate
  summary: Buys each 2% step down and sells each 2% step up, harvesting oscillation.
  best_for: Sideways, oscillating markets with no strong trend.
  main_risk: A sustained downtrend - it buys all the way down to its cap, then holds.

mode: paper

exchange:
  name: binance
  sandbox: false
  options: {}

symbols:
  - BTC/USDT
  - ETH/USDT

# Live, the grid reacts to the latest price on every poll; the timeframe sets how
# finely a backtest replays history.
timeframe: 1h
poll_seconds: 60

strategy:
  name: grid
  params:
    spacing_pct: 0.02        # 2% between lines; must clear ~0.3% round-trip costs

risk:
  position_pct: 0.06         # each grid tranche is 6% of equity
  max_open_positions: 2      # = number of symbols
  allow_averaging_in: true   # REQUIRED: each line down adds a tranche to the stack
  max_position_pct: 0.30     # stack cap: at most 5 tranches (30% of equity) per symbol
  stop_loss_pct: 0.15        # wide disaster stop on the stack's average entry
  take_profit_pct: 0.0       # off: the grid sells line by line itself
  max_drawdown_pct: 0.25

paper:
  starting_cash: 10000.0
  quote_currency: USDT
  fee_rate: 0.001
  slippage_pct: 0.0005

logging:
  level: INFO
  file: logs/crypto-bot.log
