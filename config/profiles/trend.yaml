# ── TREND profile (Supertrend) ─────────────────────────────────────────────
# Volatility-adaptive trend-following on daily bars. The Supertrend line trails
# price by a multiple of its Average True Range, so it gives a move room to breathe
# when volatile and tightens when calm; the bot holds until the line flips. No
# take-profit: a trend follower earns its keep on a few big winners, so they are
# allowed to run. Entries are only taken while the long-run trend is up.
#
#   crypto-bot backtest --bot trend --days 365
#   crypto-bot run --bot trend

# Catalog metadata (descriptive only): `crypto-bot bots` lists it, `compare` measures it.
bot:
  name: Trend Rider
  category: trend
  risk_level: 3            # up to ~45% deployed, long-only, trend-filtered
  return_potential: high
  summary: Rides daily Supertrend flips on three majors and holds until the trend breaks.
  best_for: Strong, persistent up-trends; stands aside in bear markets.
  main_risk: Sideways chop, and giving back part of a move before the line flips.

mode: paper

exchange:
  name: binance
  sandbox: false
  options: {}

symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT

# Daily bars: far fewer flips than an intraday chart, so far less fee drag.
timeframe: 1d
poll_seconds: 60
signal_on_close: true     # decide once per completed candle, exactly as a backtest does

strategy:
  name: supertrend         # buy when the trend flips up, sell when it flips down
  params:
    period: 10             # ATR lookback (classic default)
    multiplier: 3.0        # ATR band width; lower = earlier, more frequent flips

risk:
  position_pct: 0.15       # 15% of equity per position
  max_open_positions: 3
  stop_loss_pct: 0.0       # off: replaced by the volatility-scaled stop below
  atr_stop_mult: 3.0       # disaster stop 3 ATRs below entry; the Supertrend flip is the real exit
  take_profit_pct: 0.0     # off: capping winners is what held this bot back
  trend_filter_period: 200 # only buy while price is above its 200-day average
  max_drawdown_pct: 0.30
  drawdown_cooldown_days: 30 # re-arm the kill-switch after a 30-day pause

paper:
  starting_cash: 10000.0
  quote_currency: USDT
  fee_rate: 0.001
  slippage_pct: 0.0005

logging:
  level: INFO
  file: logs/crypto-bot.log
